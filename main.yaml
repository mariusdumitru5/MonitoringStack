---
# FASE 1: Creazione delle VM tramite Vagrant su localhost
- name: Step 1 - Provisioning infrastruttura locale (Vagrant)
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: vagrant_manager
      vars:
        vagrant_start_vms: true

- name: Ricarica inventario in memoria
  hosts: localhost
  connection: local
  tasks:
    - name: Refresh inventory
      ansible.builtin.meta: refresh_inventory

# FASE 2: Installazione Docker su tutte le VM
- name: Step 2 - Installazione Docker su tutti i nodi
  hosts: docker_nodes
  become: true
  roles:
    - install_docker

- import_playbook: playbooks/01_node_exporter.yaml
- import_playbook: playbooks/02_elasticsearch.yaml
- import_playbook: playbooks/03_prometheus.yaml
- import_playbook: playbooks/04_grafana.yaml
