---
- name: Crea utente dedicato per node_exporter
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /sbin/nologin
    create_home: false

- name: Scarica ed estrai il tarball di Node Exporter (v1.12.1)
  ansible.builtin.unarchive:
    src: "https://github.com/prometheus/node_exporter/releases/download/v1.12.1/node_exporter-1.12.1.linux-amd64.tar.gz"
    dest: /tmp
    remote_src: true

- name: Copia l'eseguibile in /usr/local/bin
  ansible.builtin.copy:
    src: /tmp/node_exporter-1.12.1.linux-amd64/node_exporter
    dest: /usr/local/bin/node_exporter
    mode: '0755'
    remote_src: true
    owner: node_exporter
    group: node_exporter

- name: Crea il file di servizio systemd con porta personalizzata
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: '0644'
  notify: Restart Node Exporter

- name: Assicura che il servizio sia avviato ed abilitato
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true

- name: Assicura che firewalld sia installato ed avviato
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true

- name: Apri la porta di Node Exporter nel firewall
  ansible.posix.firewalld:
    port: "{{ node_exporter_port | default(9100) }}/tcp"
    permanent: true
    state: enabled
    immediate: true