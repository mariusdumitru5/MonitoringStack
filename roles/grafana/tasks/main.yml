---
- name: Carica le variabili cifrate dal Vault
  ansible.builtin.include_vars:
    file: vars/vault.yml 

- name: Crea directory dati e provisioning per Grafana
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0777"
  loop:
    - /opt/grafana/data
    - /opt/grafana/provisioning/datasources
    - /opt/grafana/provisioning/dashboards

- name: Provisioning Datasource Prometheus in Grafana
  ansible.builtin.copy:
    dest: /opt/grafana/provisioning/datasources/prometheus.yml
    mode: "0644"
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://192.168.56.10:9090
          isDefault: true

- name: Deploy Container Grafana con volume persistente
  community.docker.docker_container:
    name: grafana
    image: grafana/grafana:latest
    state: started
    restart_policy: always
    ports:
      - "3000:3000"
    volumes:
      - /opt/grafana/data:/var/lib/grafana
      - /opt/grafana/provisioning:/etc/grafana/provisioning

- name: Import automatico Dashboard Node Exporter Full (ID 1860) via API
  block:
    - name: Scarica il JSON della Dashboard Node Exporter Full (1860) sul Mac
      ansible.builtin.get_url:
        url: "https://grafana.com/api/dashboards/1860/revisions/latest/download"
        dest: "/tmp/node_exporter_full.json"
      delegate_to: localhost
      become: false

    - name: Attendi che Grafana sia pronto ed operativo
      ansible.builtin.uri:
        url: "http://localhost:3000/api/health"
        status_code: 200
      register: grafana_health
      until: grafana_health.status == 200
      retries: 10
      delay: 3

    - name: Importa la Dashboard in Grafana usando il modulo community.grafana
      community.grafana.grafana_dashboard:
        grafana_url: "http://192.168.56.11:3000"
        url_username: "{{ grafana_admin_user }}"
        url_password: "{{ grafana_admin_password }}"
        state: present
        commit_message: "Importata via Ansible"
        overwrite: true
        path: "/tmp/node_exporter_full.json"