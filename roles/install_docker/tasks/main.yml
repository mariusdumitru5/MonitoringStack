---
# tasks file for install_docker

- name: Pulizia di vecchie configurazioni repository Docker
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/docker.list
    - /etc/apt/sources.list.d/docker.sources

- name: Aggiornameto cache apt e installazione prerequisti 
  ansible.builtin.apt:
    name:
      - ca-certificates 
      - curl 
      - gnupg 
      - python3-apt
    state: present 
    update_cache: true
     
- name: Creazione directory per il keyring di apt 
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory 
    mode: '0755'
- name: Scarico chiave GPG di Docker 
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Aggiungo repository ufficiale di Docker
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/debian
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: "{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else ansible_facts['architecture'] }}"
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Installo Docker
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli 
      - containerd.io 
      - docker-buildx-plugin
    state: present 
    update_cache: true

- name: Abilito il servizio Docker 
  ansible.builtin.systemd:
    name: docker 
    state: started 
    enabled: true 
    
- name: Aggiungo utente vagrant al gruppo docker 
  ansible.builtin.user:
    name: '{{ item }}'
    groups: docker 
    append: true 
  loop: '{{ users }}'